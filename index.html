<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <div class="calc">
      <div class="screen"></div>
      <div class="buttons">
        <div class="main-buttons">
          <button class="num-btn" id="num-7">7</button>
          <button class="num-btn" id="num-8">8</button>
          <button class="num-btn" id="num-9">9</button>
          <button id="delete">Del</button>
          <button id="reset">AC</button>
          <button class="num-btn" id="num-4">4</button>
          <button class="num-btn" id="num-5">5</button>
          <button class="num-btn" id="num-6">6</button>
          <button id="multiply">X</button>
          <button id="divide">/</button>
          <button class="num-btn" id="num-1">1</button>
          <button class="num-btn" id="num-2">2</button>
          <button class="num-btn" id="num-3">3</button>
          <button id="plus">+</button>
          <button id="minus">-</button>
          <button class="num-btn" id="num-0">0</button>
          <button id="dot">.</button>
          <button id="equal">=</button>
        </div>
      </div>
    </div>
  </body>
</html>
